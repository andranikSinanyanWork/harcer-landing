            var isAndroid = /Android/i.test(ua);
            // iPadOS Safari reports itself as a Mac, so tell it apart by touch.

                (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

                // harcer.am/get?utm_source=instagram&utm_campaign=reel12 reaches
                // Play as the install referrer, which Firebase Analytics reads.
                var query = location.search.slice(1);
                var referrer = /(^|&)utm_/.test(query)
                    ? '&referrer=' + encodeURIComponent(query)
                    : '';
                location.replace(PLAY_STORE + referrer);
            } else if (isIOS) {
                location.replace(APP_STORE);
            } else {
                location.replace('/#download');
            }
        })();
